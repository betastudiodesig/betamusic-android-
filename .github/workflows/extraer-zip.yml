name: Extraer proyecto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extraer ZIP
        run: |
          if [ ! -f "BetaMusic-Android-2.0-Rebuilt.zip" ]; then
            echo "No se encuentra el ZIP"
            exit 1
          fi

          mkdir -p /tmp/betamusic
          unzip -o "BetaMusic-Android-2.0-Rebuilt.zip" -d /tmp/betamusic
          cp -a /tmp/betamusic/. .

      - name: Guardar archivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extraer proyecto Android desde ZIP"
            git push
          else
            echo "No hay cambios que guardar"
          fi
