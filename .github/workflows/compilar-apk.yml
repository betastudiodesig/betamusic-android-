name: Extraer ZIP y compilar BetaMusic

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'BetaMusic-Android-Fase1-Completo.zip'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto nuevo
        run: |
          mkdir extraido
          unzip -q BetaMusic-Android-Fase1-Completo.zip -d extraido
          if [ -f extraido/BetaMusic-Android/settings.gradle.kts ] || [ -f extraido/BetaMusic-Android/settings.gradle ]; then
            mv extraido/BetaMusic-Android proyecto
          elif [ -f extraido/settings.gradle.kts ] || [ -f extraido/settings.gradle ]; then
            mv extraido proyecto
          else
            echo "No se encontró settings.gradle ni settings.gradle.kts en el ZIP"
            find extraido -maxdepth 3 -type f | head -80
            exit 1
          fi
          test -f proyecto/app/build.gradle.kts || test -f proyecto/app/build.gradle
          echo "PROYECTO=$PWD/proyecto" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle --no-daemon -p "$PROYECTO" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: BetaMusic-Android-debug
          path: proyecto/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
