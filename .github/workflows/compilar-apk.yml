
name: Compilar BetaMusic Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ßetaMusic-Android/**'
      - '.github/workflows/compilar-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ßetaMusic-Android

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar APK de depuracion
        run: ./gradlew assembleDebug --stacktrace

      - name: Guardar APK como artefacto
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BetaMusic-Android-APK
          path: ßetaMusic-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
